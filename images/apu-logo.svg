<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="apuLogoTitle">
  <title id="apuLogoTitle">APU Sports Hub logo</title>
  <defs>
    <linearGradient id="apuShieldFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3a5c"/>
      <stop offset="100%" stop-color="#162036"/>
    </linearGradient>
    <linearGradient id="apuAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A9EDE"/>
      <stop offset="100%" stop-color="#7fc4f5"/>
    </linearGradient>
  </defs>

  <!-- Shield badge -->
  <path d="M32 2
           L58 11
           V29
           C58 45 47 56 32 62
           C17 56 6 45 6 29
           V11
           Z"
        fill="url(#apuShieldFill)"
        stroke="#4A9EDE"
        stroke-width="2"/>

  <!-- Inner hairline for a crisp badge edge -->
  <path d="M32 6
           L54 14
           V29
           C54 43 44.5 52.5 32 57.8
           C19.5 52.5 10 43 10 29
           V14
           Z"
        fill="none"
        stroke="rgba(245,243,238,0.18)"
        stroke-width="1"/>

  <!-- Dynamic "A" monogram built from two strokes + crossbar, angled for motion -->
  <path d="M32 15 L44.5 46 H38.6 L36.1 39.4 H27.9 L25.4 46 H19.5 L32 15 Z M30.1 34.3 H33.9 L32 28.6 Z"
        fill="#f5f3ee"/>

  <!-- Accent swoosh underneath, suggesting a track / motion line -->
  <path d="M14 50 C21 54.5 43 54.5 50 50"
        fill="none"
        stroke="url(#apuAccent)"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>
